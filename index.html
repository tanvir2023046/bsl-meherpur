<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>বাংলাদেশ ছাত্রলীগ — মেহেরপুর জেলা শাখা | CV ও সাংগঠনিক তথ্য ব্যবস্থাপনা</title>
<style>
/* ============================================================
   BCL Meherpur — iOS-inspired, Bengali-first, mobile-first UI
   Green-based professional identity. Restrained, no heavy gradients.
   ============================================================ */
:root {
  --green: #0e7a3d;
  --green-dark: #0a5c2e;
  --green-soft: #e8f5ec;
  --red: #d63b2f;
  --ink: #1c1e21;
  --muted: #6b7280;
  --bg: #f2f4f3;
  --card: #ffffff;
  --line: #e5e7eb;
  --radius: 16px;
  --shadow: 0 2px 12px rgba(16, 24, 20, 0.07);
  --shadow-lg: 0 8px 28px rgba(16, 24, 20, 0.12);
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; }
body {
  margin: 0; font-family: "Hind Siliguri", "Noto Sans Bengali", "SolaimanLipi", system-ui, sans-serif;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
#app { min-height: 100dvh; padding-bottom: calc(76px + var(--sab)); }
#app.no-nav { padding-bottom: 0; }

/* ---------- header ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255,255,255,.86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding: calc(10px + var(--sat)) 16px 10px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
  width: 38px; height: 38px; border-radius: 12px; background: var(--green);
  color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none;
}
.brand h1 { font-size: 15px; margin: 0; line-height: 1.25; }
.brand small { color: var(--muted); font-size: 12px; }
.topbar .spacer { flex: 1; }
.avatar-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--green-soft);
  color: var(--green-dark); font-weight: 700; cursor: pointer;
}

/* ---------- layout ---------- */
.page { max-width: 1180px; margin: 0 auto; padding: 16px 16px 24px; animation: pageIn .28s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.page-title { font-size: 22px; font-weight: 800; margin: 4px 0 2px; }
.page-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }

.card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 18px; margin-bottom: 14px; border: 1px solid rgba(0,0,0,.02);
}
.card h3 { margin: 0 0 12px; font-size: 16px; }

/* ---------- stats ---------- */
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px; }
@media (min-width: 720px) { .stats-grid { grid-template-columns: repeat(5, 1fr); } }
.stat {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px 14px; text-align: center; border-top: 4px solid var(--green);
}
.stat .num { font-size: 30px; font-weight: 800; color: var(--green-dark); line-height: 1.1; }
.stat .lbl { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.bar-row .name { width: 110px; flex: none; }
.bar-track { flex: 1; height: 10px; background: #edf0ee; border-radius: 99px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--green); border-radius: 99px; transition: width .6s ease; }
.bar-row .val { width: 36px; text-align: right; font-weight: 700; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
.field label .req { color: var(--red); }
input, select, textarea {
  width: 100%; padding: 12px 14px; font-size: 15px; font-family: inherit;
  border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(14,122,61,.12);
}
textarea { min-height: 84px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
@media (min-width: 720px) { .form-grid.two { grid-template-columns: 1fr 1fr; } }
.field .err { color: var(--red); font-size: 12.5px; margin-top: 4px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 22px; border-radius: 14px; border: 0; font-size: 15px; font-weight: 700;
  font-family: inherit; cursor: pointer; background: var(--green); color: #fff;
  transition: transform .12s ease, opacity .15s, background .15s;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
}
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn.secondary { background: #eef1ef; color: var(--ink); }
.btn.danger { background: var(--red); }
.btn.ghost { background: transparent; color: var(--green-dark); }
.btn.small { padding: 9px 14px; font-size: 13.5px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn.loading { position: relative; color: transparent; pointer-events: none; }
.btn.loading::after {
  content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.sticky-actions {
  position: sticky; bottom: calc(76px + var(--sab)); z-index: 30;
  background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
  padding: 12px 16px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; border-radius: 18px 18px 0 0; margin: 18px -16px -24px;
}
@media (min-width: 900px) { .sticky-actions { bottom: 0; border-radius: 0; } }

/* ---------- list / table ---------- */
.list-item {
  display: flex; gap: 12px; align-items: center; padding: 14px 16px;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  margin-bottom: 10px; cursor: pointer; transition: transform .12s;
  border: 1px solid rgba(0,0,0,.02);
}
.list-item:active { transform: scale(.985); }
.list-item .thumb {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--green-soft);
  display: grid; place-items: center; font-weight: 800; color: var(--green-dark); flex: none; overflow: hidden;
}
.list-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.list-item .meta { flex: 1; min-width: 0; }
.list-item .meta .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .meta .s { color: var(--muted); font-size: 12.5px; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
  background: var(--green-soft); color: var(--green-dark); flex: none;
}
.badge.draft { background: #fef3e2; color: #b45309; }
.badge.submitted { background: #e0effe; color: #1d4ed8; }
.badge.verified { background: var(--green-soft); color: var(--green-dark); }
.badge.archived { background: #f1f2f4; color: var(--muted); }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th, table.data td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--line); }
table.data th { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.table-wrap { overflow-x: auto; border-radius: 12px; }

/* ---------- wizard ---------- */
.steps { display: flex; gap: 6px; margin: 0 0 18px; overflow-x: auto; padding-bottom: 4px; }
.step-dot {
  flex: 1; min-width: 86px; text-align: center; font-size: 12px; color: var(--muted);
  padding: 9px 6px; border-radius: 12px; background: #fff; border: 1.5px solid var(--line); cursor: pointer;
  transition: all .15s;
}
.step-dot.active { border-color: var(--green); color: var(--green-dark); font-weight: 700; background: var(--green-soft); }
.step-dot.done { border-color: var(--green); color: var(--green); }

/* ---------- live preview ---------- */
.builder { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 1024px) { .builder { grid-template-columns: 1fr 1fr; align-items: start; } }
.preview-pane { position: sticky; top: 76px; }
.preview-doc {
  background: #fff; border-radius: 8px; box-shadow: var(--shadow-lg);
  padding: 34px 30px; font-size: 13.5px; line-height: 1.7; color: #222;
  max-height: calc(100dvh - 130px); overflow: auto;
}
.preview-doc .cv-head { text-align: center; border-bottom: 3px double var(--green-dark); padding-bottom: 12px; margin-bottom: 16px; }
.preview-doc .cv-head h2 { margin: 0; color: var(--green-dark); font-size: 19px; }
.preview-doc .cv-head .org { font-weight: 700; font-size: 15px; }
.preview-doc h4.sec { color: var(--green-dark); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin: 18px 0 8px; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 2px 8px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
.cv-photo { width: 110px; height: 130px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; float: right; margin: 0 0 8px 12px; background: #f6f7f6; }
.preview-doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.preview-doc th, .preview-doc td { border: 1px solid #d9d9d9; padding: 5px 7px; text-align: left; }
.preview-doc th { background: #f2f7f3; }
.fab-preview {
  position: fixed; right: 18px; bottom: calc(92px + var(--sab)); z-index: 45;
  width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--green); color: #fff;
  font-size: 24px; box-shadow: var(--shadow-lg); cursor: pointer;
}
.fab-preview:active { transform: scale(.94); }
@media (min-width: 1024px) { .fab-preview { display: none; } }
.preview-sheet {
  position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45);
  display: flex; align-items: flex-end; animation: fadeIn .2s ease;
}
.preview-sheet .sheet {
  background: #fff; width: 100%; max-height: 92dvh; border-radius: 20px 20px 0 0;
  overflow: auto; padding: 20px 16px calc(24px + var(--sab)); animation: sheetUp .28s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .6; } }

/* ---------- tree ---------- */
.tree ul { list-style: none; margin: 0; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.tree-node { margin: 2px 0; }
.tree-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px;
  background: #fff; border: 1px solid var(--line); cursor: pointer; font-size: 14.5px; font-weight: 600;
}
.tree-row .count { margin-left: auto; }
.tree-toggle { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: #f7f8f7; cursor: pointer; font-size: 14px; line-height: 1; flex: none; }
.type-tag { font-size: 11px; color: var(--muted); font-weight: 600; }

/* ---------- bottom nav ---------- */
#bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,255,255,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line);
  display: flex; padding: 8px 6px calc(8px + var(--sab));
}
#bottomnav a {
  flex: 1; text-align: center; text-decoration: none; color: var(--muted);
  font-size: 11px; font-weight: 600; padding: 4px 2px; border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
#bottomnav a .ic { font-size: 21px; line-height: 1; }
#bottomnav a.active { color: var(--green-dark); }

/* ---------- toast / modal / skeleton ---------- */
#toasts { position: fixed; top: calc(14px + var(--sat)); left: 50%; transform: translateX(-50%); z-index: 200; width: min(92vw, 420px); }
.toast {
  background: #1f2937; color: #fff; border-radius: 14px; padding: 13px 16px; margin-bottom: 8px;
  font-size: 14px; box-shadow: var(--shadow-lg); animation: toastIn .25s ease; display: flex; gap: 10px; align-items: center;
}
.toast.ok { background: var(--green-dark); }
.toast.err { background: #b91c1c; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } }
.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.45);
  display: grid; place-items: center; padding: 18px; animation: fadeIn .18s ease;
}
.modal {
  background: #fff; border-radius: 20px; width: min(94vw, 480px); max-height: 88dvh; overflow: auto;
  padding: 22px; box-shadow: var(--shadow-lg); animation: modalIn .22s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(.94); } }
.skel { border-radius: 12px; background: linear-gradient(90deg, #eceff0 25%, #f7f9f8 50%, #eceff0 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- cropper ---------- */
.crop-stage { position: relative; width: 100%; height: 300px; background: #111; border-radius: 14px; overflow: hidden; touch-action: none; }
.crop-stage canvas { position: absolute; cursor: grab; }
.crop-frame {
  position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
  pointer-events: none;
}

/* ---------- login ---------- */
.login-wrap { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--green-soft); }
.login-card { width: min(94vw, 400px); }
.login-card .brand { justify-content: center; margin-bottom: 18px; }
.login-card .brand .logo { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; }
.center { text-align: center; }
.mt { margin-top: 14px; }
.row-flex { display: flex; gap: 10px; align-items: center; }
.chip { display: inline-block; padding: 6px 12px; background: #eef1ef; border-radius: 99px; font-size: 13px; margin: 0 6px 6px 0; }
.searchbar { position: sticky; top: 60px; z-index: 20; padding: 8px 0; background: var(--bg); }
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
.filters select { width: auto; flex: none; padding: 9px 12px; font-size: 13.5px; }
.empty { text-align: center; color: var(--muted); padding: 44px 16px; }
.empty .big { font-size: 44px; margin-bottom: 8px; }
.sig-img { max-width: 220px; max-height: 90px; border: 1px dashed var(--line); border-radius: 8px; background: #fff; }

</style>
<style media="print">
/* print.css — A4 print / PDF view for CVs. Pages flow naturally; no fixed page count. */
@media print {
  body { background: #fff; }
  #bottomnav, .topbar, .sticky-actions, .fab-preview, #toasts, .no-print { display: none !important; }
  #app { padding: 0; }
  .page { max-width: none; padding: 0; animation: none; }
  .card { box-shadow: none; border: 0; padding: 0; margin: 0; }
}
.print-doc {
  font-family: "Hind Siliguri", "Noto Sans Bengali", "SolaimanLipi", serif;
  color: #111; font-size: 12pt; line-height: 1.65; background: #fff;
}
.print-doc .p-head { text-align: center; border-bottom: 3pt double #0a5c2e; padding-bottom: 10pt; margin-bottom: 14pt; }
.print-doc .p-head h1 { margin: 0; font-size: 20pt; color: #0a5c2e; }
.print-doc .p-head .org { font-size: 14pt; font-weight: 700; }
.print-doc .p-head .slogan { font-size: 10pt; color: #555; }
.print-doc h3.sec {
  font-size: 13pt; color: #0a5c2e; border-bottom: 1pt solid #ccc;
  padding-bottom: 3pt; margin: 16pt 0 8pt; page-break-after: avoid;
}
.print-doc .p-photo { width: 3.2cm; height: 3.8cm; object-fit: cover; border: 1pt solid #999; float: right; margin: 0 0 8pt 12pt; }
.print-doc dl.kv { display: grid; grid-template-columns: 4.2cm 1fr; gap: 2pt 8pt; margin: 0; }
.print-doc dl.kv dt { color: #444; }
.print-doc dl.kv dd { margin: 0; font-weight: 600; }
.print-doc table { width: 100%; border-collapse: collapse; font-size: 10.5pt; }
.print-doc th, .print-doc td { border: 1pt solid #999; padding: 4pt 6pt; text-align: left; }
.print-doc th { background: #eef5f0; }
.print-doc tr, .print-doc h3.sec, .print-doc dl.kv { page-break-inside: avoid; }
.print-doc .p-foot { margin-top: 18pt; display: flex; justify-content: space-between; }
.print-doc .p-sig { text-align: center; font-size: 10.5pt; }
.print-doc .p-sig img { max-width: 4.5cm; max-height: 2cm; }
@page { size: A4; margin: 18mm 15mm; }

</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <nav id="bottomnav" class="hidden"></nav>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script>
/* ============================================================
   BCL Meherpur — SPA frontend (vanilla JS, no build step)
   ============================================================ */
'use strict';

const App = {
  user: null,
  perms: [],
  units: [],
  unitsById: {},
  positions: [],
  roles: [],
  route: null,
};

/* ---------- tiny helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bnDigits = s => String(s ?? '').replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'কিছু একটা সমস্যা হয়েছে');
  return data;
}

function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<span>${type === 'ok' ? '✓' : type === 'err' ? '⚠' : 'ℹ'}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
}

function modal(html, { wide = false } = {}) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal" ${wide ? 'style="width:min(94vw,720px)"' : ''}>${html}</div>`;
  back.addEventListener('click', e => { if (e.target === back) closeModal(); });
  $('#modal-root').appendChild(back);
  return back;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function confirmDialog(title, text, okLabel = 'নিশ্চিত করুন') {
  return new Promise(resolve => {
    const m = modal(`<h3 style="margin-top:0">${esc(title)}</h3><p style="color:#555">${esc(text)}</p>
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn secondary" data-x="no">বাতিল</button>
        <button class="btn danger" data-x="yes">${esc(okLabel)}</button>
      </div>`);
    m.addEventListener('click', e => {
      const x = e.target.dataset.x;
      if (x) { closeModal(); resolve(x === 'yes'); }
    });
  });
}

function skeleton(n = 4) {
  return Array(n).fill('<div class="skel" style="height:64px;margin-bottom:10px"></div>').join('');
}

const STATUS_BN = { draft: 'খসড়া', submitted: 'জমা দেওয়া', verified: 'যাচাইকৃত', archived: 'আর্কাইভ' };
const TYPE_BN = { district: 'জেলা', upazila: 'উপজেলা', municipality: 'পৌরসভা', union: 'ইউনিয়ন', ward: 'ওয়ার্ড', village: 'গ্রাম', other: 'অন্যান্য' };

function can(perm) { return App.perms.includes(perm); }
function unitName(id) { return App.unitsById[id]?.name_bn || '—'; }
function unitPath(id) {
  const parts = []; let u = App.unitsById[id];
  while (u) { parts.unshift(u.name_bn); u = App.unitsById[u.parent_id]; }
  return parts.join(' → ');
}

/* ---------- shell / navigation ---------- */
const NAV = [
  { hash: '#/dashboard', icon: '📊', label: 'ড্যাশবোর্ড', perm: 'view_dashboard' },
  { hash: '#/cvs', icon: '📄', label: 'সিভি', perm: 'view_members' },
  { hash: '#/directory', icon: '🗂️', label: 'ডিরেক্টরি', perm: 'view_dashboard' },
  { hash: '#/admin', icon: '⚙️', label: 'অ্যাডমিন', perm: 'manage_units' },
];

function renderShell() {
  const nav = $('#bottomnav');
  if (!App.user) { nav.classList.add('hidden'); $('#app').classList.add('no-nav'); return; }
  $('#app').classList.remove('no-nav');
  nav.classList.remove('hidden');
  nav.innerHTML = NAV.filter(n => can(n.perm)).map(n =>
    `<a href="${n.hash}" data-nav="${n.hash}" class="${App.route === n.hash ? 'active' : ''}">
       <span class="ic">${n.icon}</span><span>${n.label}</span></a>`).join('');
}

function topbar(title, sub) {
  return `<header class="topbar">
    <div class="brand"><div class="logo">ছা</div>

function roleLabel(r) { return (App.roles.find(x => x.name === r) || {}).label_bn || r; }

/* ---------- router ---------- */
const routes = {};
function setView(html) { $('#view').innerHTML = html; window.scrollTo(0, 0); }

async function boot() {
  try {
    const me = await api('/api/me');
    App.user = me.user; App.perms = me.permissions;
  } catch { App.user = null; }
  if (App.user) {
    try {
      const [u, p, r] = await Promise.all([api('/api/units'), api('/api/positions'), api('/api/roles')]);
      App.units = u.units; App.positions = p.positions; App.roles = r.roles;
      App.unitsById = Object.fromEntries(u.units.map(x => [x.id, x]));
    } catch (e) { console.warn(e); }
  }
  renderShell();
  window.addEventListener('hashchange', navigate);
  navigate();
}

async function navigate() {
  let hash = location.hash || '#/dashboard';
  if (!App.user && hash !== '#/login') hash = '#/login';
  if (App.user && hash === '#/login') hash = '#/dashboard';
  App.route = hash.split('?')[0].split('/').slice(0, 2).join('/');
  renderShell();
  const [page, param] = hash.replace('#/', '').split('/');
  const fn = routes[page] || routes.dashboard;
  try { await fn(param, hash); }
  catch (e) { setView(`<div class="page"><div class="card"><p>⚠ ${esc(e.message)}</p></div></div>`); }
}
document.addEventListener('DOMContentLoaded', boot);

/* ---------- CV builder (multi-step wizard + live preview) ---------- */
const PERSONAL_FIELDS = [
  ['full_name', 'পূর্ণ নাম', 1], ['full_name_en', 'নামের ইংরেজি বানান'], ['father_name', "পিতার নাম"],
  ['mother_name', 'মাতার নাম'], ['dob', 'জন্ম তারিখ', 0, 'date'], ['nationality', 'জাতীয়তা'],
  ['religion', 'ধর্ম'], ['marital', 'বৈবাহিক অবস্থা', 0, 'select', ['অবিবাহিত', 'বিবাহিত', 'বিধবা', 'তালাকপ্রাপ্ত']],
  ['blood', 'রক্তের গ্রুপ', 0, 'select', ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-']],
  ['mobile', 'মোবাইল নম্বর', 1, 'tel'], ['mobile2', 'বিকল্প মোবাইল নম্বর', 0, 'tel'],
  ['email', 'ইমেইল', 0, 'email'], ['nid', 'জাতীয় পরিচয়পত্র নম্বর'],
  ['present_address', 'বর্তমান ঠিকানা', 0, 'textarea'], ['permanent_address', 'স্থায়ী ঠিকানা', 0, 'textarea'],
];
const ORG_LEVELS = [
  ['district', 'জেলা'], ['upazila', 'উপজেলা'], ['municipality', 'পৌরসভা'],
  ['union', 'ইউনিয়ন'], ['ward', 'ওয়ার্ড'], ['village', 'গ্রাম/মহল্লা'],
];
const STEPS = ['ব্যক্তিগত তথ্য', 'সাংগঠনিক তথ্য', 'শিক্ষা', 'অভিজ্ঞতা', 'কার্যক্রম', 'ছবি ও স্বাক্ষর'];

let WZ = null; // wizard state

function blankCv() {
  return { personal: { nationality: 'বাংলাদেশী' }, org: { level: 'union' }, education: [], experience: [], activities: {}, status: 'draft', unit_id: App.user.unit_id };
}

routes.cv = async (param) => {
  if (param === 'new') return startWizard(null);
  if (param === 'print') return; // handled below via #/cv/:id/print
  const parts = location.hash.replace('#/cv/', '').split('/');
  if (parts[1] === 'print') return renderPrintView(parts[0]);
  if (parts[1] === 'edit') {
    const { cv } = await api('/api/cvs/' + parts[0]);
    return startWizard(cv);
  }
  return renderCvDetail(parts[0]);
};

async function startWizard(existing) {
  WZ = {
    step: 0,
    id: existing?.id || null,
    cv_code: existing?.cv_code || null,
    data: existing ? existing.data : blankCv(),
    photo_path: existing?.photo_path || null,
    signature_path: existing?.signature_path || null,
    serverStatus: existing?.status || 'draft',
  };
  // restore local autosaved draft
  if (!existing) {
    try {
      const local = JSON.parse(localStorage.getItem('bcl_cv_draft') || 'null');
      if (local && confirm('আগের অসমাপ্ত খসড়া পাওয়া গেছে। চালিয়ে যাবেন?')) WZ.data = local;
    } catch {}
  }
  renderWizard();
}

function renderWizard() {
  const s = WZ.step;
  setView(topbar(WZ.id ? 'CV সম্পাদনা' : 'নতুন CV', `ধাপ ${bnDigits(s + 1)} / ${bnDigits(STEPS.length)}`) + `
  <div class="page"><div class="builder">
    <div>
      <div class="steps">${STEPS.map((t, i) =>
        `<div class="step-dot ${i === s ? 'active' : ''} ${i < s ? 'done' : ''}" data-step="${i}">${bnDigits(i + 1)}. ${t}</div>`).join('')}</div>
      <div class="card" id="stepBody"></div>
      <div class="sticky-actions">
        ${s > 0 ? '<button class="btn secondary" id="wPrev">← আগের ধাপ</button>' : '<button class="btn secondary" id="wClear">মুছুন</button>'}
        <div style="flex:1"></div>
        <button class="btn secondary" id="wSave">খসড়া সংরক্ষণ</button>
        ${s < STEPS.length - 1 ? '<button class="btn" id="wNext">পরের ধাপ →</button>' : '<button class="btn" id="wSubmit">জমা দিন ✓</button>'}
      </div>
    </div>
    <div class="preview-pane" id="previewPane"><div class="card"><h3>লাইভ প্রিভিউ</h3><div class="preview-doc" id="livePreview"></div></div></div>
  </div></div>
  <button class="fab-preview" id="fabPrev" title="প্রিভিউ">👁</button>`);

  renderStep(); renderLivePreview();

  $$('.step-dot').forEach(d => d.addEventListener('click', () => { collectStep(); WZ.step = +d.dataset.step; renderWizard(); }));
  $('#wPrev')?.addEventListener('click', () => { collectStep(); WZ.step--; renderWizard(); });
  $('#wClear')?.addEventListener('click', async () => {
    if (await confirmDialog('খসড়া মুছুন', 'ফর্মের সব তথ্য মুছে যাবে।')) {
      localStorage.removeItem('bcl_cv_draft'); WZ.data = blankCv(); renderWizard();
    }
  });
  $('#wNext').addEventListener('click', () => { if (validateStep()) { collectStep(); autosaveLocal(); WZ.step++; renderWizard(); } });
  $('#wSave').addEventListener('click', () => saveToServer('draft'));
  $('#wSubmit').addEventListener('click', () => { if (validateStep()) { collectStep(); saveToServer('submitted'); } });
  $('#fabPrev')?.addEventListener('click', () => {
    const sh = document.createElement('div');
    sh.className = 'preview-sheet';
    sh.innerHTML = `<div class="sheet"><div class="row-flex" style="justify-content:space-between;margin-bottom:10px">
      <b>CV প্রিভিউ</b><button class="btn secondary small" id="shClose">বন্ধ করুন</button></div>
      <div class="preview-doc">${$('#livePreview').innerHTML}</div></div>`;
    sh.addEventListener('click', e => { if (e.target === sh || e.target.id === 'shClose') sh.remove(); });
    document.body.appendChild(sh);
  });
}

function collectStep() {
  const body = $('#stepBody');
  if (!body) return;
  $$('input,select,textarea', body).forEach(el => {
    const [sec, key] = (el.name || '').split('.');
    if (!sec || !key || el.dataset.skip) return;
    WZ.data[sec] = WZ.data[sec] || {};
    WZ.data[sec][key] = el.type === 'checkbox' ? el.checked : el.value;
  });
  renderLivePreview();
}
function autosaveLocal() {
  try { localStorage.setItem('bcl_cv_draft', JSON.stringify(WZ.data)); } catch {}
}

function validateStep() {
  const errs = [];
  if (WZ.step === 0) {
    const p = WZ.data.personal || {};
    if (!p.full_name?.trim()) errs.push('পূর্ণ নাম আবশ্যক');
    if (p.mobile && !/^01[0-9]{9}$/.test(p.mobile.replace(/[\s-]/g, ''))) errs.push('মোবাইল নম্বর সঠিক নয়');
    if (p.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) errs.push('ইমেইল ঠিকানা সঠিক নয়');
  }
  if (WZ.step === 1 && !WZ.data.org?.current_post?.trim()) errs.push('বর্তমান পদ লিখুন');
  if (errs.length) { toast(errs[0], 'err'); return false; }
  return true;
}

async function saveToServer(status) {
  const btn = status === 'draft' ? $('#wSave') : $('#wSubmit');
  btn.classList.add('loading');
  try {
    const payload = { data: WZ.data, unit_id: WZ.data.unit_id || App.user.unit_id, status,
      photo_path: WZ.photo_path, signature_path: WZ.signature_path };
    let id = WZ.id;
    if (id) await api('/api/cvs/' + id, { method: 'PUT', body: payload });
    else { const r = await api('/api/cvs', { method: 'POST', body: payload }); id = r.id; WZ.id = id; WZ.cv_code = r.cv_code;
      if (r.duplicate_mobile) toast('সতর্কতা: এই মোবাইল নম্বরে আরেকটি CV আছে', 'err'); }
    localStorage.removeItem('bcl_cv_draft');
    toast(status === 'draft' ? 'খসড়া সংরক্ষণ করা হয়েছে' : 'CV জমা দেওয়া হয়েছে', 'ok');
    btn.classList.remove('loading');
    if (status !== 'draft') location.hash = '#/cv/' + id;
  } catch (e) { toast(e.message, 'err'); btn.classList.remove('loading'); }
}

/* ----- step bodies ----- */
function renderStep() {
  const el = $('#stepBody');
  [renderPersonal, renderOrg, renderEdu, renderExp, renderAct, renderMedia][WZ.step](el);
  // re-attach dynamic listeners after render
  el.querySelector('#orgLevel')?.addEventListener('change', e => { collectStep(); WZ.data.org.level = e.target.value; renderStep(); });
  el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
    collectStep();
    const k = b.dataset.add;
    WZ.data[k].push(k === 'education' ? {} : {});
    renderStep(); renderLivePreview();
  }));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    collectStep();
    WZ.data[b.dataset.del].splice(+b.dataset.i, 1);
    renderStep(); renderLivePreview();
  }));
  el.querySelectorAll('input,select,textarea').forEach(i => i.addEventListener('input', () => { collectStep(); }));
}

function fieldHtml(sec, key, label, req = 0, type = 'text', options = null) {
  const val = esc(WZ.data[sec]?.[key] ?? '');
  let input;
  if (type === 'select') input = `<select name="${sec}.${key}"><option value="">নির্বাচন করুন</option>${options.map(o => `<option ${val === o ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  else if (type === 'textarea') input = `<textarea name="${sec}.${key}">${val}</textarea>`;
  else input = `<input name="${sec}.${key}" type="${type}" value="${val}">`;
  return `<div class="field"><label>${label}${req ? ' <span class="req">*</span>' : ''}</label>${input}</div>`;
}

function renderPersonal(el) {
  el.innerHTML = `<h3 style="margin-top:0">ব্যক্তিগত তথ্য</h3><div class="form-grid two">` +
    PERSONAL_FIELDS.map(([k, l, req, type, opts]) => fieldHtml('personal', k, l, req, type, opts)).join('') + `</div>`;
}

function unitOptions(type, selected, parentId = null) {
  return App.units.filter(u => u.type === type && (!parentId || u.parent_id === Number(parentId)))
    .map(u => `<option value="${u.id}" ${String(selected) === String(u.id) ? 'selected' : ''}>${esc(u.name_bn)}</option>`).join('');
}

function renderOrg(el) {
  const o = WZ.data.org || {};
  const lvl = o.level || 'union';
  const lvlIdx = ORG_LEVELS.findIndex(l => l[0] === lvl);
  let geo = '';
  // show selectors up to the chosen level
  const chain = [
    ['upazila', 'উপজেলা', 'upazila_id'],
    ['municipality', 'পৌরসভা', 'municipality_id'],
    ['union', 'ইউনিয়ন', 'union_id'],
    ['ward', 'ওয়ার্ড', 'ward_id'],
    ['village', 'গ্রাম/মহল্লা', 'village_id'],
  ];
  for (const [t, lbl, key] of chain) {
    const ti = ORG_LEVELS.findIndex(l => l[0] === t);
    if (ti <= lvlIdx && ti > 0) {
      const parentKey = { municipality: 'upazila_id', union: 'upazila_id', ward: 'municipality_id', village: 'ward_id' }[t];
      geo += `<div class="field"><label>${lbl}</label><select name="org.${key}" data-skip="0">
        <option value="">নির্বাচন করুন</option>${unitOptions(t, o[key], parentKey ? o[parentKey] : null)}</select></div>`;
    }
  }
  const posOpts = App.positions.map(p => `<option ${o.current_post === p.title_bn ? 'selected' : ''}>${esc(p.title_bn)}</option>`).join('');
  el.innerHTML = `<h3 style="margin-top:0">সাংগঠনিক তথ্য</h3><div class="form-grid two">
    <div class="field"><label>সাংগঠনিক স্তর <span class="req">*</span></label>

function openCropper(file, kind) {
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const frame = kind === 'photo' ? { w: 300, h: 360 } : { w: 420, h: 170 };
    const m = modal(`<h3 style="margin-top:0">ছবি ক্রপ করুন</h3>
      <div class="crop-stage" id="cropStage"><canvas id="cropCv"></canvas>
        <div class="crop-frame" id="cropFrame" style="width:${frame.w / 2}px;height:${frame.h / 2}px"></div></div>
      <div class="field" style="margin-top:12px"><label>জুম</label>
        <input type="range" id="cropZoom" min="0.5" max="3" step="0.05" value="1" style="padding:0"></div>
      <div class="btn-row" style="justify-content:flex-end">
        <button class="btn secondary" data-x="cancel">বাতিল</button>
        <button class="btn" data-x="ok">সংরক্ষণ ✓</button></div>`, { wide: true });
    const stage = $('#cropStage', m), cv = $('#cropCv', m), ctx = cv.getContext('2d');
    const scale = Math.min(stage.clientWidth / img.width, stage.clientHeight / img.height);
    cv.width = img.width * scale; cv.height = img.height * scale;
    let zoom = 1, ox = 0, oy = 0, drag = null;
    const draw = () => {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, ox, oy, cv.width * zoom, cv.height * zoom);
      const f = $('#cropFrame', m);
      f.style.left = (stage.clientWidth / 2 - f.offsetWidth / 2) + 'px';
      f.style.top = (stage.clientHeight / 2 - f.offsetHeight / 2) + 'px';
    };
    draw();
    $('#cropZoom', m).addEventListener('input', e => { zoom = +e.target.value; draw(); });
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX - ox, y: e.clientY - oy }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (drag) { ox = e.clientX - drag.x; oy = e.clientY - drag.y; draw(); } });
    cv.addEventListener('pointerup', () => drag = null);
    m.addEventListener('click', async e => {
      const x = e.target.dataset.x;
      if (x === 'cancel') closeModal();
      if (x === 'ok') {
        // export cropped region
        const f = $('#cropFrame', m);
        const rx = (stage.clientWidth / 2 - f.offsetWidth / 2 - ox) / (scale * zoom);
        const ry = (stage.clientHeight / 2 - f.offsetHeight / 2 - oy) / (scale * zoom);
        const rw = f.offsetWidth / (scale * zoom), rh = f.offsetHeight / (scale * zoom);
        const out = document.createElement('canvas');
        out.width = frame.w; out.height = frame.h;
        const octx = out.getContext('2d');
        octx.fillStyle = '#fff'; octx.fillRect(0, 0, out.width, out.height);
        octx.drawImage(img, Math.max(0, rx), Math.max(0, ry), Math.min(img.width, rw), Math.min(img.height, rh), 0, 0, out.width, out.height);
        out.toBlob(async blob => {
          const fd = new FormData(); fd.append('file', blob, 'crop.png');
          try {
            const r = await fetch('/api/upload', { method: 'POST', body: fd }).then(r => r.json());
            if (r.error) throw new Error(r.error);
            if (kind === 'photo') WZ.photo_path = r.path; else WZ.signature_path = r.path;
            closeModal(); renderStep(); renderLivePreview(); toast('ছবি সংরক্ষণ করা হয়েছে', 'ok');
          } catch (err) { toast(err.message, 'err'); }
        }, 'image/png');
      }
    });
  };
  img.src = URL.createObjectURL(file);
}

/* ---------- organizational directory (tree browser) ---------- */
routes.directory = async () => {
  setView(topbar('সাংগঠনিক ডিরেক্টরি', 'মেহেরপুর জেলা → উপজেলা → ইউনিয়ন → ওয়ার্ড') +
    `<div class="page"><div class="card tree" id="dirTree">${skeleton(4)}</div></div>`);
  try {
    const [{ tree }, { cvs }] = await Promise.all([
      api('/api/units/tree'),
      can('view_members') ? api('/api/cvs') : { cvs: [] },
    ]);
    const counts = {};
    for (const c of cvs) if (c.unit_id) counts[c.unit_id] = (counts[c.unit_id] || 0) + 1;
    const renderNode = (n, depth) => `
      <div class="tree-node"><div class="tree-row" data-unit="${n.id}">
        <button class="tree-toggle" data-t="${n.id}">${n.children.length ? '▸' : '•'}</button>
        <span>${esc(n.name_bn)}</span><span class="type-tag">${TYPE_BN[n.type] || ''}</span>
        ${can('view_members') && counts[n.id] ? `<span class="badge count">${bnDigits(counts[n.id])} জন</span>` : ''}
      </div>
      ${n.children.length ? `<ul class="hidden" data-kids="${n.id}">${n.children.map(c => renderNode(c, depth + 1)).join('')}</ul>` : ''}
      </div>`;
    $('#dirTree').innerHTML = `<ul>${tree.map(n => renderNode(n, 0)).join('')}</ul>`;
    $('#dirTree').addEventListener('click', e => {
      const t = e.target.closest('[data-t]');
      if (t) {
        const kids = $(`[data-kids="${t.dataset.t}"]`);
        if (kids) { kids.classList.toggle('hidden'); t.textContent = kids.classList.contains('hidden') ? '▸' : '▾'; }
        return;
      }
      const row = e.target.closest('[data-unit]');
      if (row) location.hash = '#/cvs?unit=' + row.dataset.unit;
    });
  } catch (e) { $('#dirTree').innerHTML = `<p>⚠ ${esc(e.message)}</p>`; }
};

/* ---------- admin panel ---------- */
routes.admin = async (param) => {
  const tab = param || 'units';
  setView(topbar('অ্যাডমিন প্যানেল', '') + `<div class="page">
    <div class="filters">
      ${can('manage_units') ? `<a class="chip" href="#/admin/units" style="${tab === 'units' ? 'background:var(--green);color:#fff' : ''};text-decoration:none">🏢 ইউনিট ব্যবস্থাপনা</a>` : ''}
      ${can('manage_positions') ? `<a class="chip" href="#/admin/positions" style="${tab === 'positions' ? 'background:var(--green);color:#fff' : ''};text-decoration:none">🎖️ পদ ব্যবস্থাপনা</a>` : ''}
      ${can('manage_users') ? `<a class="chip" href="#/admin/users" style="${tab === 'users' ? 'background:var(--green);color:#fff' : ''};text-decoration:none">👥 ব্যবহারকারী</a>` : ''}
    </div><div id="adminBody">${skeleton(4)}</div></div>`);
  if (tab === 'units' && can('manage_units')) return adminUnits();
  if (tab === 'positions' && can('manage_positions')) return adminPositions();
  if (tab === 'users' && can('manage_users')) return adminUsers();
  $('#adminBody').innerHTML = '<div class="card">অনুমতি নেই</div>';
};

async function adminUnits() {
  const { tree } = await api('/api/units/tree');
  const renderNode = n => `
    <div class="tree-node"><div class="tree-row">
      <button class="tree-toggle" data-t="${n.id}">${n.children.length ? '▸' : '•'}</button>
      <span>${esc(n.name_bn)}</span><span class="type-tag">${TYPE_BN[n.type] || ''}</span>
      <span style="margin-left:auto"></span>
      <button class="btn ghost small" data-edit="${n.id}">✏️</button>
      <button class="btn secondary small" data-add="${n.id}">＋</button>
      <button class="btn danger small" data-del="${n.id}">🗑</button>
    </div>
    ${n.children.length ? `<ul class="hidden" data-kids="${n.id}">${n.children.map(renderNode).join('')}</ul>` : ''}</div>`;
  $('#adminBody').innerHTML = `<div class="card"><div class="row-flex" style="justify-content:space-between;margin-bottom:12px">
    <h3 style="margin:0">সাংগঠনিক ইউনিট</h3><button class="btn small" id="unitNew">＋ নতুন ইউনিট</button></div>
    <div class="tree">${tree.map(renderNode).join('')}</div></div>`;

  $('#adminBody').addEventListener('click', async e => {
    const t = e.target.closest('[data-t]');
    if (t) { const k = $(`[data-kids="${t.dataset.t}"]`); if (k) { k.classList.toggle('hidden'); t.textContent = k.classList.contains('hidden') ? '▸' : '▾'; } return; }
    if (e.target.id === 'unitNew' || e.target.dataset.add) return unitForm(e.target.dataset.add || null);
    if (e.target.dataset.edit) return unitForm(+e.target.dataset.edit, true);
    if (e.target.dataset.del) {
      const id = +e.target.dataset.del;
      const u = App.unitsById[id];
      if (await confirmDialog('ইউনিট নিষ্ক্রিয় করুন', `“${u.name_bn}” নিষ্ক্রিয় করা হবে।`, 'নিষ্ক্রিয় করুন')) {
        await api('/api/units/' + id, { method: 'PUT', body: { is_active: false } });
        toast('নিষ্ক্রিয় করা হয়েছে', 'ok'); location.reload();
      }
    }
  });
}

function unitForm(parentId, editId = null) {
  const u = editId ? App.unitsById[editId] : null;
  const typeOpts = Object.entries(TYPE_BN).map(([v, l]) =>
    `<option value="${v}" ${u?.type === v ? 'selected' : ''}>${l}</option>`).join('');
  const parentOpts = `<option value="">— মূল (কোনো প্যারেন্ট নেই) —</option>` + App.units
    .map(x => `<option value="${x.id}" ${(u?.parent_id ?? parentId) == x.id ? 'selected' : ''}>${esc(unitPath(x.id))}</option>`).join('');
  const m = modal(`<h3 style="margin-top:0">${u ? 'ইউনিট সম্পাদনা' : 'নতুন ইউনিট'}</h3>
    <div class="field"><label>নাম (বাংলা) *</label><input id="ufName" value="${esc(u?.name_bn || '')}"></div>
    <div class="field"><label>নাম (ইংরেজি)</label><input id="ufEn" value="${esc(u?.name_en || '')}"></div>
    <div class="field"><label>ধরন</label><select id="ufType">${typeOpts}</select></div>
    <div class="field"><label>প্যারেন্ট ইউনিট</label><select id="ufParent">${parentOpts}</select></div>
    <div class="btn-row" style="justify-content:flex-end">
      <button class="btn secondary" data-x="c">বাতিল</button>
      <button class="btn" data-x="s">সংরক্ষণ ✓</button></div>`, { wide: true });
  m.addEventListener('click', async e => {
    const x = e.target.dataset.x;
    if (x === 'c') closeModal();
    if (x === 's') {
      try {
        const body = { name_bn: $('#ufName').value, name_en: $('#ufEn').value || null,
          type: $('#ufType').value, parent_id: $('#ufParent').value || null };
        if (u) await api('/api/units/' + u.id, { method: 'PUT', body });
        else await api('/api/units', { method: 'POST', body });
        closeModal(); toast('সংরক্ষণ করা হয়েছে', 'ok'); location.reload();
      } catch (err) { toast(err.message, 'err'); }
    }
  });
}

async function adminPositions() {
  const { positions } = await api('/api/positions');
  $('#adminBody').innerHTML = `<div class="card"><div class="row-flex" style="justify-content:space-between;margin-bottom:12px">
    <h3 style="margin:0">পদসমূহ</h3><button class="btn small" id="posNew">＋ নতুন পদ</button></div>
    <div class="table-wrap"><table class="data"><tr><th>পদের নাম</th><th></th></tr>
    ${positions.map(p => `<tr><td>${esc(p.title_bn)}</td>
      <td style="text-align:right"><button class="btn danger small" data-posdel="${p.id}">নিষ্ক্রিয়</button></td></tr>`).join('')}
    </table></div></div>`;
  $('#adminBody').addEventListener('click', async e => {
    if (e.target.id === 'posNew') {
      const m = modal(`<h3 style="margin-top:0">নতুন পদ</h3>
        <div class="field"><label>পদের নাম *</label><input id="pfName"></div>
        <div class="btn-row" style="justify-content:flex-end"><button class="btn" data-x="s">যোগ করুন</button></div>`);
      m.addEventListener('click', async ev => {
        if (ev.target.dataset.x === 's') {
          try { await api('/api/positions', { method: 'POST', body: { title_bn: $('#pfName').value } });
            closeModal(); toast('যোগ করা হয়েছে', 'ok'); location.reload(); }
          catch (err) { toast(err.message, 'err'); }
        }
      });
    }
    if (e.target.dataset.posdel) {
      await api('/api/positions/' + e.target.dataset.posdel, { method: 'PUT', body: { is_active: false } });
      toast('নিষ্ক্রিয় করা হয়েছে', 'ok'); location.reload();
    }
  });
}

async function adminUsers() {
  const { users, roles } = await api('/api/users');
  $('#adminBody').innerHTML = `<div class="card"><div class="row-flex" style="justify-content:space-between;margin-bottom:12px">
    <h3 style="margin:0">ব্যবহারকারী</h3><button class="btn small" id="userNew">＋ নতুন ব্যবহারকারী</button></div>
    <div class="table-wrap"><table class="data"><tr><th>নাম</th><th>ইউজারনেম</th><th>ভূমিকা</th><th>ইউনিট</th><th>সক্রিয়</th><th></th></tr>
    ${users.map(u => `<tr><td>${esc(u.full_name || '—')}</td><td>${esc(u.username)}</td>
      <td>${esc(u.role_bn || u.role)}</td><td>${esc(u.unit_name || '—')}</td>
      <td>${u.is_active ? '✓' : '✗'}</td>
      <td style="text-align:right"><button class="btn secondary small" data-uedit="${u.id}">✏️</button></td></tr>`).join('')}
    </table></div></div>`;
  const userForm = (u = null) => {
    const roleOpts = roles.map(r => `<option value="${r.name}" ${u?.role === r.name ? 'selected' : ''}>${esc(r.label_bn)}</option>`).join('');
    const unitOpts = `<option value="">—</option>` + App.units.map(x =>
      `<option value="${x.id}" ${u?.unit_id == x.id ? 'selected' : ''}>${esc(unitPath(x.id))}</option>`).join('');
    const m = modal(`<h3 style="margin-top:0">${u ? 'ব্যবহারকারী সম্পাদনা' : 'নতুন ব্যবহারকারী'}</h3>
      ${u ? '' : `<div class="field"><label>ইউজারনেম *</label><input id="ufU"></div>
      <div class="field"><label>পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label><input id="ufP" type="password"></div>`}
      <div class="field"><label>পুরো নাম</label><input id="ufN" value="${esc(u?.full_name || '')}"></div>
      <div class="field"><label>ভূমিকা</label><select id="ufR">${roleOpts}</select></div>
      <div class="field"><label>সাংগঠনিক ইউনিট (স্কোপ)</label><select id="ufUn">${unitOpts}</select></div>
      ${u ? `<div class="field"><label>নতুন পাসওয়ার্ড (ঐচ্ছিক)</label><input id="ufP" type="password"></div>
      <div class="field"><label><input type="checkbox" id="ufA" style="width:auto" ${u.is_active ? 'checked' : ''}> সক্রিয়</label></div>` : ''}
      <div class="btn-row" style="justify-content:flex-end"><button class="btn" data-x="s">সংরক্ষণ ✓</button></div>`, { wide: true });
    m.addEventListener('click', async e => {
      if (e.target.dataset.x !== 's') return;
      try {
        const body = { full_name: $('#ufN').value, role: $('#ufR').value, unit_id: $('#ufUn').value || null };
        const pw = $('#ufP').value;
        if (u) { if (pw) body.password = pw; body.is_active = $('#ufA').checked;
          await api('/api/users/' + u.id, { method: 'PUT', body }); }
        else { body.username = $('#ufU').value; body.password = pw;
          await api('/api/users', { method: 'POST', body }); }
        closeModal(); toast('সংরক্ষণ করা হয়েছে', 'ok'); location.reload();
      } catch (err) { toast(err.message, 'err'); }
    });
  };
  $('#userNew').addEventListener('click', () => userForm());
  $('#adminBody').addEventListener('click', e => {
    const id = e.target.dataset.uedit;
    if (id) userForm(users.find(u => u.id === +id));
  });
}
